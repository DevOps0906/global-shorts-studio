[project]
name = "gss-worker"
version = "0.1.0"
description = "global-shorts-studio 분석 워커(pgmq analyze)"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/llm.py" = ["E501"]  # 한국어 프롬프트 문자열
