<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>글로벌쇼츠 스튜디오 — 로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.app{--bg:#0B0B0D;--panel:#141518;--card:#1C1D21;--card2:#232429;--line:#2A2B31;--text:#F4F4F5;--sub:#A1A1AA;--accent:#FFD83D;--pink:#FF5C9E;--ok:#22C55E;--danger:#E5484D;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 600px at 20% -10%,#2a2412 0%,rgba(11,11,13,0) 60%),var(--bg);min-height:100vh;font-size:14px;line-height:1.55}
.util{display:flex;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);font-size:12px}
.brand{display:inline-flex;align-items:center;gap:8px}.brand .bm{width:22px;height:22px;flex:none}.brand .bt{display:flex;flex-direction:column;line-height:1.05}.brand .bt b{font-size:12px;font-weight:900;letter-spacing:.4px}.brand .bt i{font-style:normal;font-size:9px;color:var(--sub);letter-spacing:1.2px;text-transform:uppercase}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px}
.logo{font-weight:900;font-size:20px}.logo b{color:var(--accent)}
.topr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--card);color:var(--text);font:inherit;font-size:12px;font-weight:500;cursor:pointer}
.pill.on{background:var(--accent);color:#111;font-weight:700}
.pill .dot{width:7px;height:7px;border-radius:99px;background:var(--ok)}
.wrap{max-width:1040px;margin:0 auto;padding:12px 20px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.h1{margin:0 0 6px;font-size:26px;font-weight:900}
.h2{margin:0;font-size:17px;font-weight:900}.h2 small{font-weight:500;color:var(--sub);font-size:12px;margin-left:8px}
.lead{margin:0;color:var(--sub);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 15px;border-radius:999px;border:1.5px solid transparent;background:var(--card);color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.chip.on{border-color:var(--accent);background:#1f1c10}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 18px;border-radius:12px;border:0;background:linear-gradient(90deg,#FFD24D,#FF5C9E);color:#111;font:inherit;font-weight:900;font-size:13.5px;cursor:pointer}
.btn2{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 12px;border-radius:9px;border:0;background:var(--card2);color:var(--text);font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.btn2.dg{color:#ff8a8f}
.in{width:100%;box-sizing:border-box;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:13px;padding:0 12px}
textarea.in{min-height:96px;padding:10px 12px;resize:vertical}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border-radius:14px;padding:14px}.kpi span{display:block;font-size:11.5px;color:var(--sub)}.kpi b{display:block;font-size:24px;font-weight:900;margin-top:2px}.kpi b.a{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.item .m{flex:1 1 180px;min-width:0}.item .m b{display:block;font-size:14px}.item .m span{display:block;font-size:12px;color:var(--sub)}
.item .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item.off{opacity:.55}
.tag{display:inline-flex;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#2a2b31;color:var(--sub)}
.tag.ok{background:#12301c;color:#4ade80}.tag.run{background:#1f1c10;color:var(--accent)}.tag.bad{background:#3a1517;color:#ff8a8f}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:#3a3b42;position:relative;cursor:pointer;flex:none;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:99px;background:#fff;transition:left .18s}
.sw.on{background:var(--ok)}.sw.on i{left:21px}
.tbox{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11.5px;color:var(--sub);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.lbl{display:block;font-size:12px;color:var(--sub);margin:12px 0 6px}
.faq{display:flex;justify-content:space-between;width:100%;text-align:left;min-height:46px;align-items:center;padding:0 14px;border:0;border-radius:12px;background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
.ans{display:none;margin:6px 6px 8px;color:var(--sub);font-size:13px}.ans.open{display:block}
.center{max-width:440px;margin:60px auto 0;text-align:center}
.muted{color:var(--sub);font-size:12px}
@media (max-width:1199px){.h1{font-size:22px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){.app{font-size:13px}.h1{font-size:18px}.h2{font-size:15px}.card{padding:16px}.two{grid-template-columns:minmax(0,1fr)}.brand .bt{display:none}.kpi b{font-size:20px}.wrap{padding:8px 12px 48px}.top{padding:10px 12px}.util{padding:8px 12px}}

button,.pill,.chip,.tile,.btn2,.mini,.type,.cta,.ghost,.save,.upl,.ring,.seg,.th,.col,.lnk,.run,.hc{transition:transform .15s ease,filter .15s ease,background-color .15s ease,border-color .15s ease,box-shadow .2s ease}
.pill:hover,.chip:hover,.btn2:hover,.mini:hover,.tile:hover,.th:hover,.col:hover,.ring:hover,.ghost:hover{filter:brightness(1.18);transform:translateY(-1px)}
.cta:hover,.save:hover,.upl:hover,.run:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 8px 22px rgba(255,92,158,.28)}
.type:hover,.hc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.4)}
button:active,.pill:active,.cta:active,.chip:active,.tile:active,.btn2:active,.type:active,.save:active,.run:active,.upl:active,.ring:active,.th:active,.col:active{transform:scale(.96)!important;filter:brightness(.95)}
button:focus-visible,a:focus-visible{outline:2px solid #FFD83D;outline-offset:2px}
button:disabled{cursor:wait;opacity:.55;transform:none!important}
.pill.sel{box-shadow:inset 0 0 0 1.5px #FFD83D;color:#FFD83D}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:11px 18px;border-radius:12px;background:#26272d;border:1px solid #3a3b42;color:#F4F4F5;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:50;animation:toastin .25s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.pg{width:100%;max-width:420px;margin:14px auto 6px;text-align:left}
.pg .tx{display:flex;justify-content:space-between;font-size:11.5px;color:#A1A1AA;margin-bottom:6px}
.pg .tx b{color:#FFD83D;font-weight:900}
.pgr{display:block;width:100%;height:10px;border:0;border-radius:99px;overflow:hidden;appearance:none;-webkit-appearance:none;background:#2a2b31}
.pgr::-webkit-progress-bar{background:#2a2b31;border-radius:99px}
.pgr::-webkit-progress-value{border-radius:99px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 8px,rgba(255,255,255,0) 8px 16px),linear-gradient(90deg,#FFD24D,#FF5C9E);background-size:32px 32px,100% 100%;animation:pstripe .8s linear infinite;transition:width .5s ease}
.pgr::-moz-progress-bar{border-radius:99px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 8px,rgba(255,255,255,0) 8px 16px),linear-gradient(90deg,#FFD24D,#FF5C9E);background-size:32px 32px,100% 100%;animation:pstripe .8s linear infinite}
@keyframes pstripe{to{background-position:32px 0,0 0}}
@media (prefers-reduced-motion:reduce){.pgr::-webkit-progress-value,.pgr::-moz-progress-bar{animation:none}.type:hover,.hc:hover,.pill:hover{transform:none}}
</style>
</helmet>
<div class="app">
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast" role="status">{{toast}}</div></sc-if>
<main class="center">
<div class="brand" style="justify-content: center; margin-bottom: 14px"><span ><svg class="bm" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD24D"/><stop offset="1" stop-color="#FF5C9E"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#bg2)"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#0B0B0D" stroke-width="1.8"/><ellipse cx="16" cy="16" rx="3.6" ry="8.5" fill="none" stroke="#0B0B0D" stroke-width="1.4"/><path d="M7.5 16h17" stroke="#0B0B0D" stroke-width="1.4"/><path d="M14 12.6v6.8l5.6-3.4z" fill="#0B0B0D"/></svg><span class="bt"><b>NOMAD</b><i>AI Factory</i></span></span></div>
<div class="logo" style="font-size: 30px">글로벌쇼츠 <b>스튜디오</b></div>
<p class="lead" style="margin-top: 8px">{{headline}}</p>
<div class="card" style="margin-top: 22px; text-align: left">
<span class="lbl" style="margin-top: 0">이메일</span><input class="in" placeholder="you@example.com" value="{{email}}" onChange="{{onEmail}}">
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px">
<button type="button" class="btn" onClick="{{login}}" disabled="{{busy}}">{{label}}</button>
<button type="button" class="btn2" style="min-height: 42px" onClick="{{link}}" disabled="{{busy}}">이메일로 로그인 링크 받기</button>
</div>
<sc-if value="{{hasPg}}" hint-placeholder-val="{{ false }}"><div class="pg" style="margin-left: 0"><div class="tx"><span>{{pgLabel}}</span><b>{{pct}}%</b></div><progress class="pgr" max="100" value="{{pct}}"></progress></div></sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ false }}"><a class="btn" style="margin-top: 14px; display: flex" href="Main.dc.html">스튜디오 시작하기 →</a></sc-if>
</div>
<p class="muted" style="margin-top: 14px">처음이라면 로그인과 동시에 가입돼요 · 강의 수강생은 강의 번들이 자동 적용돼요</p>
<p><a class="muted" href="Main.dc.html">로그인 없이 둘러보기(샘플)</a></p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { email: '', p: -1, ready: false, mode: 'login', toast: '' }; this.tt = null; this.tp = null; }
  componentWillUnmount() { clearTimeout(this.tt); clearInterval(this.tp); }
  say(m) { var s = this; clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(function () { s.setState({ toast: '' }); }, 2200); }
  go(mode) {
    var self = this;
    if (this.state.p >= 0) return;
    if (mode === 'link' && !this.state.email.trim()) { this.say('이메일을 먼저 입력해 주세요.'); return; }
    clearInterval(this.tp);
    this.setState({ p: 0, mode: mode, ready: false });
    this.tp = setInterval(function () {
      var p = Math.min(100, self.state.p + 10 + Math.floor(Math.random() * 16));
      if (p >= 100) { clearInterval(self.tp); self.setState({ p: -1, ready: true }); self.say(mode === 'link' ? '로그인 링크를 보냈어요. (샘플)' : '로그인했어요. (샘플)'); }
      else self.setState({ p: p });
    }, 240);
  }
  renderVals() {
    var self = this, st = this.state;
    return {
      headline: st.ready ? '준비가 끝났어요.' : '로그아웃했어요. 다시 로그인해 주세요.',
      email: st.email, onEmail: function (e) { self.setState({ email: e.target.value }); },
      busy: st.p >= 0, label: st.p >= 0 ? '확인 중…' : '구글 계정으로 계속하기',
      hasPg: st.p >= 0, pct: Math.max(0, st.p), pgLabel: st.mode === 'link' ? '로그인 링크 보내는 중…' : '계정 확인 중…',
      ready: st.ready,
      login: function () { self.go('login'); }, link: function () { self.go('link'); },
      hasToast: !!st.toast, toast: st.toast
    };
  }
}
</script>
</body>
</html>
